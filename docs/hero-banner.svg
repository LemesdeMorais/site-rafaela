<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">Rafaela Lemes Portfolio Hero</title>
<desc id="desc">Premium visual asset for Rafaela Lemes portfolio README.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b0b10"/>
    <stop offset="55%" stop-color="#11111a"/>
    <stop offset="100%" stop-color="#17131f"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#b58cff"/>
    <stop offset="100%" stop-color="#ff8ec7"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#b58cff" stop-opacity=".28"/>
    <stop offset="60%" stop-color="#ff8ec7" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>

<circle cx="1120" cy="340" r="250" fill="url(#glow)" filter="url(#soft)"/>
<circle cx="1120" cy="340" r="210" fill="none" stroke="#b58cff" stroke-opacity=".16"/>
<ellipse cx="1120" cy="340" rx="230" ry="180" fill="none" stroke="#ff8ec7" stroke-opacity=".12" transform="rotate(-14 1120 340)"/>
<circle cx="994" cy="216" r="6" fill="#ff8ec7"/>
<text x="1100" y="300" fill="#ffffff" opacity=".035" font-family="Georgia, serif" font-size="116" font-weight="700" text-anchor="middle">Rafaela</text>
<text x="1160" y="382" fill="#ffffff" opacity=".035" font-family="Georgia, serif" font-size="116" font-weight="700" text-anchor="middle">Lemes</text>
<text x="1100" y="334" fill="url(#accent)" font-family="cursive" font-size="96" text-anchor="middle" transform="rotate(-7 1100 334)">Rafaela</text>
<text x="1160" y="410" fill="url(#accent)" font-family="cursive" font-size="84" text-anchor="middle" transform="rotate(-7 1160 410)">Lemes</text>
<path d="M1040 440 C1110 420 1190 432 1260 420" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity=".72"/>
<text x="110" y="145" fill="#cbb8ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" opacity="1">RAFAELA LEMES</text><text x="110" y="240" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="600" text-anchor="start" opacity="1">Design.</text><text x="110" y="318" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="600" text-anchor="start" opacity="1">Estratégia.</text><text x="110" y="396" fill="url(#accent)" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="600" text-anchor="start" opacity="1">Desenvolvimento.</text><text x="110" y="475" fill="#b8b2c7" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" opacity="1">Experiências digitais com presença, intenção e detalhe.</text><rect x="110" y="525" width="290" height="54" rx="27" fill="#f4efff" stroke="#f4efff" stroke-width="1" opacity="1"/><text x="255" y="560" fill="#111019" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" opacity="1">VER PROJETO</text><text x="110" y="650" fill="#8f899d" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" opacity="1">React  •  TypeScript  •  Vite  •  SCSS  •  Motion</text>
</svg>