<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">Mobile Portfolio Preview</title>
<desc id="desc">Premium visual asset for Rafaela Lemes portfolio README.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b0b10"/>
    <stop offset="55%" stop-color="#11111a"/>
    <stop offset="100%" stop-color="#17131f"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#b58cff"/>
    <stop offset="100%" stop-color="#ff8ec7"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#b58cff" stop-opacity=".28"/>
    <stop offset="60%" stop-color="#ff8ec7" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<rect x="490" y="50" width="460" height="900" rx="38" fill="#0f0f16" stroke="#302b3a" stroke-width="3" opacity="1"/><rect x="635" y="68" width="170" height="24" rx="12" fill="#20202c"/><text x="540" y="155" fill="#c5a9ff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" opacity="1">SUA PRESENÇA DIGITAL</text><text x="540" y="235" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="650" text-anchor="start" opacity="1">Seu negócio</text><text x="540" y="287" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="650" text-anchor="start" opacity="1">merece um site</text><text x="540" y="339" fill="url(#accent)" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="650" text-anchor="start" opacity="1">à sua altura.</text><text x="540" y="405" fill="#aaa4b8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" opacity="1">Experiência elegante, clara</text><text x="540" y="434" fill="#aaa4b8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" opacity="1">e construída nos detalhes.</text><rect x="540" y="490" width="260" height="52" rx="26" fill="#f1ecff" stroke="#f1ecff" stroke-width="1" opacity="1"/><text x="670" y="523" fill="#15121b" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1">VAMOS CONVERSAR</text><circle cx="760" cy="700" r="145" fill="url(#glow)" filter="url(#soft)"/><text x="720" y="690" fill="url(#accent)" font-family="cursive" font-size="72" font-weight="400" text-anchor="middle" opacity="0.9">Rafaela</text><text x="755" y="748" fill="url(#accent)" font-family="cursive" font-size="64" font-weight="400" text-anchor="middle" opacity="0.9">Lemes</text>
</svg>