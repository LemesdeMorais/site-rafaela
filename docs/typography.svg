<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="560" viewBox="0 0 1340 560" role="img" aria-labelledby="title desc">
<title id="title">Typography System</title>
<desc id="desc">Premium visual asset for Rafaela Lemes portfolio README.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b0b10"/>
    <stop offset="55%" stop-color="#11111a"/>
    <stop offset="100%" stop-color="#17131f"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#b58cff"/>
    <stop offset="100%" stop-color="#ff8ec7"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#b58cff" stop-opacity=".28"/>
    <stop offset="60%" stop-color="#ff8ec7" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<text x="80" y="95" fill="#c5a9ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" opacity="1">TIPOGRAFIA</text><text x="80" y="170" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="650" text-anchor="start" opacity="1">Clareza editorial</text><text x="80" y="235" fill="url(#accent)" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="650" text-anchor="start" opacity="1">e assinatura humana.</text><text x="80" y="330" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="160" font-weight="650" text-anchor="start" opacity="1">Aa</text><text x="300" y="300" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" opacity="1">Inter / sans-serif</text><text x="300" y="345" fill="#9c96aa" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" opacity="1">Estrutura, leitura e precisão.</text><text x="760" y="330" fill="url(#accent)" font-family="cursive" font-size="92" font-weight="400" text-anchor="start" opacity="1">Rafaela Lemes</text><text x="765" y="390" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" opacity="1">Allura / assinatura</text><text x="765" y="435" fill="#9c96aa" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" opacity="1">Identidade, presença e gesto.</text>
</svg>