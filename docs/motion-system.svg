<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="670" viewBox="0 0 1240 670" role="img" aria-labelledby="title desc">
<title id="title">Motion System</title>
<desc id="desc">Premium visual asset for Rafaela Lemes portfolio README.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b0b10"/>
    <stop offset="55%" stop-color="#11111a"/>
    <stop offset="100%" stop-color="#17131f"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#b58cff"/>
    <stop offset="100%" stop-color="#ff8ec7"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#b58cff" stop-opacity=".28"/>
    <stop offset="60%" stop-color="#ff8ec7" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<text x="80" y="95" fill="#c5a9ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" opacity="1">MOTION SYSTEM</text><text x="80" y="150" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="650" text-anchor="start" opacity="1">Movimento com propósito</text><rect x="80" y="240" width="320" height="130" rx="22" fill="#15151f" stroke="#312b3d" stroke-width="1" opacity="1"/><circle cx="108" cy="271" r="8" fill="url(#accent)"/><text x="130" y="278" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1">Reveal</text><text x="108" y="322" fill="#8f899d" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" opacity="1">Entrada suave de conteúdo</text><path d="M108 345 H370" stroke="#b58cff" stroke-opacity=".28" stroke-width="2"/><rect x="450" y="240" width="320" height="130" rx="22" fill="#15151f" stroke="#312b3d" stroke-width="1" opacity="1"/><circle cx="478" cy="271" r="8" fill="url(#accent)"/><text x="500" y="278" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1">ReplayOnView</text><text x="478" y="322" fill="#8f899d" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" opacity="1">Reinício ao retornar à seção</text><path d="M478 345 H740" stroke="#b58cff" stroke-opacity=".28" stroke-width="2"/><rect x="820" y="240" width="320" height="130" rx="22" fill="#15151f" stroke="#312b3d" stroke-width="1" opacity="1"/><circle cx="848" cy="271" r="8" fill="url(#accent)"/><text x="870" y="278" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1">PointerEffects</text><text x="848" y="322" fill="#8f899d" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" opacity="1">Resposta global ao ponteiro</text><path d="M848 345 H1110" stroke="#b58cff" stroke-opacity=".28" stroke-width="2"/><rect x="80" y="430" width="320" height="130" rx="22" fill="#15151f" stroke="#312b3d" stroke-width="1" opacity="1"/><circle cx="108" cy="461" r="8" fill="url(#accent)"/><text x="130" y="468" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1">GSAP</text><text x="108" y="512" fill="#8f899d" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" opacity="1">Sequências e controle temporal</text><path d="M108 535 H370" stroke="#b58cff" stroke-opacity=".28" stroke-width="2"/><rect x="450" y="430" width="320" height="130" rx="22" fill="#15151f" stroke="#312b3d" stroke-width="1" opacity="1"/><circle cx="478" cy="461" r="8" fill="url(#accent)"/><text x="500" y="468" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1">Framer Motion</text><text x="478" y="512" fill="#8f899d" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" opacity="1">Transições declarativas</text><path d="M478 535 H740" stroke="#b58cff" stroke-opacity=".28" stroke-width="2"/><rect x="820" y="430" width="320" height="130" rx="22" fill="#15151f" stroke="#312b3d" stroke-width="1" opacity="1"/><circle cx="848" cy="461" r="8" fill="url(#accent)"/><text x="870" y="468" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1">CSS Motion</text><text x="848" y="512" fill="#8f899d" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" opacity="1">Loops e microinterações</text><path d="M848 535 H1110" stroke="#b58cff" stroke-opacity=".28" stroke-width="2"/>
</svg>