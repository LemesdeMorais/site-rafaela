<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Desktop Portfolio Preview</title>
<desc id="desc">Premium visual asset for Rafaela Lemes portfolio README.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b0b10"/>
    <stop offset="55%" stop-color="#11111a"/>
    <stop offset="100%" stop-color="#17131f"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#b58cff"/>
    <stop offset="100%" stop-color="#ff8ec7"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#b58cff" stop-opacity=".28"/>
    <stop offset="60%" stop-color="#ff8ec7" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<rect x="90" y="90" width="1260" height="650" rx="28" fill="#101018" stroke="#302b3a" stroke-width="2" opacity="1"/><rect x="90" y="90" width="1260" height="54" rx="28" fill="#171721"/><text x="720" y="124" fill="#8f899d" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" opacity="1">Desktop experience</text><circle cx="1080" cy="410" r="190" fill="url(#glow)" filter="url(#soft)"/><text x="155" y="260" fill="#f7f4ff" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="650" text-anchor="start" opacity="1">Seu negócio merece</text><text x="155" y="332" fill="url(#accent)" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="650" text-anchor="start" opacity="1">uma presença à altura.</text><text x="155" y="405" fill="#aaa4b8" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" opacity="1">Design, estratégia e desenvolvimento</text><text x="155" y="440" fill="#aaa4b8" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" opacity="1">em uma experiência digital memorável.</text><rect x="155" y="495" width="220" height="52" rx="26" fill="#f1ecff" stroke="#f1ecff" stroke-width="1" opacity="1"/><text x="265" y="528" fill="#15121b" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1">VAMOS CONVERSAR</text><text x="1080" y="385" fill="url(#accent)" font-family="cursive" font-size="84" font-weight="400" text-anchor="middle" opacity="1">Rafaela</text><text x="1130" y="460" fill="url(#accent)" font-family="cursive" font-size="74" font-weight="400" text-anchor="middle" opacity="1">Lemes</text>
</svg>