e="#312b3d" stroke-width="1" opacity="1"/><circle cx="1080" cy="350" r="76" fill="none" stroke="#b58cff" stroke-opacity=".22" stroke-width="12"/><text x="1080" y="368" fill="#f8f6ff" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" text-anchor="middle" opacity="1">—</text><text x="1080" y="460" fill="#aaa4b8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" opacity="1">SEO</text><text x="80" y="570" fill="#8f899d" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" opacity="1">Substitua os traços pelos resultados reais após executar a auditoria.</text>
